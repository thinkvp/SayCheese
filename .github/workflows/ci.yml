name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no dependencies, no lockfile to cache
                                         # (Node 22.2+ for zlib.crc32 in build.js)
      - name: Check and build
        run: |
          npm run lint
          python3 -m py_compile engine/analyzer.py engine/server.py
          npm run deps
          npm run build
